name: X Viewer Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: bash
        run: |
          curl -L -sS -o response.txt -w '%{http_code}\n' 'https://www.twitter-viewer.com/api/x/user-tweets?username=fadeawaymedia&cursor='
          head -c 200 response.txt
