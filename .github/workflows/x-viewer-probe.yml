name: X Viewer Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - shell: bash
        run: |
          curl -L -sS -o curl.txt -w 'curl status=%{http_code} type=%{content_type}\n' 'https://www.twitter-viewer.com/api/x/user-tweets?username=_akhaliq&cursor='
          head -c 100 curl.txt
          python - <<'PY'
          from curl_cffi import requests
          response = requests.get("https://www.twitter-viewer.com/api/x/user-tweets", params={"username": "_akhaliq", "cursor": ""}, headers={"User-Agent": "XGist/1.0"}, timeout=30, impersonate="chrome")
          print("\ncurl_cffi", response.status_code, response.headers.get("content-type"), response.text[:100])
          PY
